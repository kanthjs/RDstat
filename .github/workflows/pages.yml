name: Deploy prototype to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["prototype/**", "engine/**", "scripts/build_app.R", "scripts/export_site.R", ".github/workflows/pages.yml", "CHANGELOG.md"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install shiny and shinylive
        run: Rscript -e 'install.packages(c("shiny", "shinylive", "ggplot2", "writexl", "readxl", "agricolae", "lmtest", "mctest", "svglite", "lattice"))'
      - name: Copy engine into the app
        run: Rscript scripts/build_app.R
        env:
          STAR_APP_VERSION: 0.1.${{ github.run_number }}
      - name: Test the app (deploy stops if a test fails)
        run: Rscript prototype/tests/test_server.R
      - name: Export Shinylive site
        run: Rscript scripts/export_site.R _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
