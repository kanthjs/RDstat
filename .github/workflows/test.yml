name: Test

# Runs the app tests on every pull request, so a failure shows on the PR before it is merged.
# Deploying stays in pages.yml, which runs only on main.
on:
  pull_request:
    paths: ["prototype/**", "engine/**", "scripts/build_app.R", ".github/workflows/test.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install packages
        run: Rscript -e 'install.packages(c("shiny", "ggplot2", "writexl", "readxl", "agricolae", "lmtest", "mctest", "svglite", "lattice", "rstatix", "dunn.test", "WRS2"))'
      - name: Copy engine into the app
        run: Rscript scripts/build_app.R
      - name: Test the app
        run: Rscript prototype/tests/test_server.R
      - name: Compare with reference software
        run: Rscript prototype/tests/test_reference.R
